async function copyText(t, btn){

  if(btn){ const old=btn.textContent; btn.textContent= ok?'복사됨':'길게 눌러 직접 복사해 주세요'; btn.classList.toggle('done',ok); setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1800); }
}
